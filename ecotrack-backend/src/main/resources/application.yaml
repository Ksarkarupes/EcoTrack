spring:
  application:
    name: ecotrack-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  docker:
    compose:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_EXPIRATION}
    refresh-expiration: ${REFRESH_EXPIRATION}